<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Misión Nocturna 7° TIC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
/* Pantalla de traje: oscura, letra grande, se lee con poca luz. Nieve suave de fondo (la nevada) */
:root{
  --bg:#05080e; --panel:#0d1520; --line:#1f2d42; --fg:#e8eef6; --dim:#8a9bb3;
  --signal:#5cf2c4; --warn:#ffb347; --snow:#cfe3ff;
  --display:"Chakra Petch",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:18px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
#nieve{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;display:grid;gap:16px}
h1{font-family:var(--display);font-size:1.7rem;margin:0;letter-spacing:.02em}
h1 span{color:var(--signal)}
.eyebrow{font-family:var(--display);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.hud{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.radar{display:flex;gap:5px}
.dot{flex:1;height:14px;border-radius:4px;border:1px solid var(--line);max-width:30px}
.dot.ok{background:var(--signal);border-color:var(--signal);box-shadow:0 0 8px var(--signal)}
.energia{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:.85rem;color:var(--dim)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.barra i{display:block;height:100%;background:var(--signal);transition:width .4s}
.barra.baja i{background:var(--warn)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px}
.box p{margin:0;font-size:1.15rem}
.relato{border-left:3px solid var(--snow);padding-left:14px;font-style:italic;color:var(--snow)}
.found{border-color:var(--signal)}
.tipo{display:inline-block;font-family:var(--display);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--dim);justify-self:start}
.tipo.logica{border-color:var(--warn);color:var(--warn)}
.msg{font-family:var(--display);font-size:1.05rem;color:var(--signal)}
.err{color:var(--warn)}
label{font-family:var(--display);color:var(--dim);font-size:.9rem}
input{width:100%;box-sizing:border-box;font:inherit;font-size:1.2rem;padding:13px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
#cod{text-transform:uppercase}
button{font-family:var(--display);font-size:1.05rem;font-weight:700;padding:13px 16px;border-radius:10px;border:0;background:var(--signal);color:var(--bg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:2px solid var(--line)}
button.sel{border-color:var(--signal);color:var(--signal)}
button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-size:.85rem;padding:9px}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.row>button{flex:0 0 auto}
.rutas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ops{display:grid;gap:10px}.ops button{text-align:left}
.letras{display:flex;gap:6px;flex-wrap:wrap}
.letra{width:38px;height:46px;display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;font-weight:700;border:2px solid var(--signal);border-radius:8px;color:var(--signal)}
.reloj{font-family:var(--display);font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums;color:var(--signal);text-align:right}
.reloj.poco{color:var(--warn)}
.gigante{font-size:min(22vw,7rem);text-align:center}
#qr{background:#fff;padding:14px;border-radius:12px;justify-self:center}
.foto{background:#000;width:100%;border-radius:10px;display:block;aspect-ratio:16/9;object-fit:cover;max-width:100%}
.marco{position:relative;border-radius:10px;overflow:hidden}
.ventana{position:absolute;pointer-events:none;mix-blend-mode:screen}
.vela{position:absolute;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;mix-blend-mode:screen;
 background:radial-gradient(circle,rgba(255,190,110,.55) 0%,rgba(255,150,60,.22) 30%,rgba(255,120,40,0) 65%)}
@media (prefers-reduced-motion:no-preference){.vela{animation:vela 2.3s infinite}}
@keyframes vela{0%,100%{opacity:.85;transform:translate(-50%,-50%) scale(1)}18%{opacity:.6;transform:translate(-50%,-51%) scale(.94)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}52%{opacity:.7}70%{opacity:.95;transform:translate(-50%,-49%) scale(.98)}85%{opacity:.65}}
.chat{display:grid;gap:8px;max-height:46vh;overflow-y:auto;padding-right:4px}
.m{padding:10px 12px;border-radius:10px;font-size:1.05rem;max-width:88%;overflow-wrap:anywhere}
.m b{display:block;font-family:var(--display);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.m.op{background:var(--bg);border:1px solid var(--line);color:var(--snow);justify-self:start}
.m.yo{background:var(--line);justify-self:end}
.scan{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mira{position:relative;width:min(70vw,320px);aspect-ratio:1;border:3px solid var(--signal);border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
#scanmsg{position:absolute;top:calc(24px + env(safe-area-inset-top,0px));margin:0;font-family:var(--display);color:#fff}
.scanbar{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;gap:12px}
.small{color:var(--dim);font-size:.95rem}
.cartel{display:none}
@media print{body{background:#fff!important}#nieve,main>*:not(#carteles){display:none!important}
 .cartel{display:flex;flex-direction:column;align-items:center;gap:16px;page-break-after:always;color:#000;font-family:var(--display);padding-top:36px}
 .cartel h2{font-size:38px;margin:0}.cartel b{font-size:52px;font-family:monospace}.cartel p{font-size:18px;margin:0}}
@media (prefers-reduced-motion:reduce){#nieve{display:none}}
@media (prefers-reduced-motion:no-preference){.found{animation:p 1.1s ease-out 2}@keyframes p{50%{box-shadow:0 0 28px var(--signal)}}}
</style>
<canvas id="nieve" aria-hidden="true"></canvas>
<main id="app"></main>

// c = código del cartel · pista = adónde ir · a = índice de la opción correcta
const P=[
 {c:"FARO27",   pista:"El aula de 7° TIC, donde empieza todo.",                        t:"g", q:"¿Qué pueblo originario navegaba en canoa por el Canal Beagle?", ops:["Selk'nam","Yámana","Mapuche","Tehuelche"], a:1},
 {c:"LENGA84",  pista:"Donde se toma asistencia cada mañana.",                          t:"l", q:"3, 6, 12, 24, … ¿qué número sigue?", ops:["36","48","30","42"], a:1},
 {c:"CASTOR39", pista:"Donde viven las compus y un router que nunca duerme.",           t:"g", q:"¿En qué año se fundó Ushuaia?", ops:["1520","1884","1910","1955"], a:1},
 {c:"GLACIAR52",pista:"Sin esto no hay mate: donde se carga el agua.",                  t:"l", q:"Todos los trajes tienen filtro. Lo que tiene Tomás es un traje. ¿Qué es seguro?", ops:["El de Tomás tiene filtro","Todo lo que tiene filtro es un traje","El de Tomás no tiene filtro","No se puede saber nada"], a:0},
 {c:"CANAL16",  pista:"Miles de datos sin enchufe: el lugar más silencioso.",           t:"g", q:"¿Qué animal trajeron a Tierra del Fuego en 1946 y terminó siendo una plaga?", ops:["El conejo","El zorro gris","El castor","El ciervo"], a:2},

const PALABRA="COMPAÑEROS"; // una letra por posta, en el orden del relato
// El relato avanza por cantidad de postas resueltas, no por lugar: todas las rutas viven la misma historia
const INTRO="Ushuaia, viernes a la noche. Se corta la luz en toda la ciudad. Empieza a nevar, pero los copos brillan. Un perro sale a la calle y no vuelve. Elba, la portera, prende su radio a pilas: nadie contesta. Ustedes están encerrados en la escuela. Con camperas, cinta, antiparras y barbijos arman trajes. Hay diez balizas viejas repartidas por el edificio. Si las encienden todas, la señal llega a Río Grande. Afuera, la nevada no para.";
const RELATO=[
 "Encendieron la primera baliza. La radio de Elba hace un ruido. No es una voz, pero es algo.",
 "Nahuel, de 5° año, aparece con una linterna. Estaba escondido en el baño. Se suma al grupo.",
 "En la ventana, la nieve se acumula sin hacer ruido. Nadie toca el vidrio.",
 "Elba les cuenta que su abuelo era radioaficionado. Le enseñó que una señal débil, repetida, igual llega.",
 "Se escuchan pasos en el piso de arriba. Lentos. Demasiado ordenados para ser una persona.",
 "La radio capta una voz desde Tolhuin: hay otros resistiendo. No están solos.",
 "Lucía, la del buffet, trae termos con agua caliente. Sin calor no hay traje que aguante.",
 "Los pasos de arriba se detienen. Alguien, o algo, está escuchando la señal.",
 "Falta una sola baliza. La nieve ya tapa la mitad de la puerta de entrada.",
 "La última baliza se enciende. Desde Río Grande contestan: la señal llegó. Solos no lo hubieran logrado."
];

  if(!(t&&m))return false;ponerLargada({t,m,id});
  if(k){groqKey=k;try{localStorage.setItem(KG,k)}catch(e){}}return true}
if(largadaDesde(new URLSearchParams(location.search)))history.replaceState(null,"",location.pathname+location.hash);
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const norm=s=>s.trim().toUpperCase().replace(/\s+/g,"");
const two=n=>String(n).padStart(2,"0");
let aviso="";

const posta=k=>(SALIDA[st.ruta]+k)%N;          // posta que toca en el paso k
const actual=()=>posta(st.paso);
const letras=()=>PALABRA.slice(0,st.paso).split("");
function fase(){if(!cfg)return"sin";const now=Date.now();if(now<cfg.t)return"antes";if(now<cfg.t+cfg.m*60000)return"jugando";return"fin"}
function mmss(ms){const s=Math.max(0,Math.ceil(ms/1000));const h=Math.floor(s/3600);return (h?h+":"+two(Math.floor(s/60)%60):two(Math.floor(s/60)))+":"+two(s%60)}
const horaLargada=()=>{const t=new Date(cfg.t);return two(t.getHours())+":"+two(t.getMinutes())};
function textoReloj(){const f=fase();if(f==="antes")return mmss(cfg.t-Date.now());if(f==="jugando")return mmss(cfg.t+cfg.m*60000-Date.now());return f==="fin"?"00:00":""}

// Llegada a una posta: por QR (#CODIGO) o escribiendo el código del cartel
function llegar(cod){
  cod=norm(cod); if(!cod)return;
  const i=P.findIndex(p=>p.c===cod);
  if(i<0){aviso="err:Ese código no es de la misión.";return}
  if(!st.equipo){aviso="err:Primero anoten el equipo y la ruta.";return}
  if(st.fin)return;
  const f=fase();
  if(f==="sin"){aviso="err:Falta escanear el QR de largada que les muestro.";return}
  if(f==="antes"){aviso="err:Todavía no arrancó. Esperen la largada.";return}
  if(f==="fin"){aviso="err:La nevada ya cubrió todo. Se terminó el tiempo.";return}
  if(i!==actual()){const k=(i-SALIDA[st.ruta]+N)%N;aviso=k<st.paso?"ok:Esta baliza ya la encendieron.":"err:No es acá. Sigan la pista que tienen.";return}
  if(!st.buscando){aviso="ok:Ya están en la posta. Resuelvan el desafío.";return}
  st.buscando=false; save(); aviso="new:¡Señal encontrada!";
}
// Código de largada escrito a mano: HHMM-minutos (ej. 2230-30)
function largadaManual(txt){const m=String(txt).replace(/\s/g,"").match(/^(\d{1,2}):?(\d{2})-(\d{1,3})$/);if(!m)return false;
  const t=new Date();t.setHours(+m[1],+m[2],0,0);if(t.getTime()<Date.now()-3600000)t.setDate(t.getDate()+1);
  ponerLargada({t:t.getTime(),m:+m[3]});ultima=fase();return true}
const cajaLargada=()=>`<div class="box"><button class="alt" data-scan>Escanear QR de largada</button><label for="larg">${cfg?"¿Cambió la largada? Código nuevo":"Código de largada (está debajo del QR)"}</label><div class="row"><input id="larg" inputmode="numeric" placeholder="Ej: 2230-30" autocomplete="off"><button id="oklarg">Listo</button></div></div>`;
// ---------- Escáner dentro del juego (con linterna si el celu la tiene) ----------
function procesarQR(txt){let u=null;try{u=new URL(txt,location.href)}catch(e){}
  if(u&&largadaDesde(u.searchParams)){ultima=fase();aviso="ok:Largada cargada.";return}
  const cod=u&&u.hash?u.hash.slice(1):txt;llegar(cod)}
function escanear(){
  const o=document.createElement("div");o.className="scan";
  o.innerHTML=`<video playsinline muted></video><div class="mira"></div><p id="scanmsg">Apunten al QR</p><div class="scanbar"><button class="alt" id="torch" hidden>Linterna</button><button id="cerrar">Cerrar</button></div>`;
  document.body.appendChild(o);
  let stream=null,stop=false;const v=o.querySelector("video");
  const cerrar=()=>{stop=true;if(stream)stream.getTracks().forEach(t=>t.stop());o.remove()};
  o.querySelector("#cerrar").onclick=cerrar;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){cerrar();aviso="err:Este celu no deja usar la cámara acá. Usen la cámara del celu o escriban el código.";render();return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}).then(async s=>{
    stream=s;v.srcObject=s;try{await v.play()}catch(e){}
    const track=s.getVideoTracks()[0];const caps=track.getCapabilities?track.getCapabilities():{};
    const tb=o.querySelector("#torch");let on=false;
    if(caps.torch){tb.hidden=false;tb.onclick=()=>{on=!on;track.applyConstraints({advanced:[{torch:on}]}).catch(()=>{});tb.classList.toggle("sel",on)}}
    let det=null;try{if("BarcodeDetector" in window)det=new BarcodeDetector({formats:["qr_code"]})}catch(e){}
    const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
    const tick=async()=>{if(stop)return;let txt=null;
      try{if(det){const r=await det.detect(v);if(r&&r[0])txt=r[0].rawValue}}catch(e){det=null}
      if(!txt&&window.jsQR&&v.videoWidth){const w=480,h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);
        const r=jsQR(cx.getImageData(0,0,w,h).data,w,h);if(r)txt=r.data}
      if(txt){cerrar();procesarQR(txt);render();return}
      setTimeout(tick,200)};
    tick();
  }).catch(()=>{cerrar();aviso="err:No pude abrir la cámara. Den permiso a la cámara, o usen la del celu o escriban el código.";render()});
}

// ---------- Radio: chatbot con Groq (si no hay key o señal, responde en modo simulado) ----------
const sinTildes=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const dichoPorEquipo=()=>sinTildes(st.chat.filter(m=>m.r==="u").map(m=>m.t).join(" "));
const verificados=()=>{const d=dichoPorEquipo();let n=0;for(const v of VERIFICAR){if(d.includes(v.ok))n++;else break}return n};
function simulado(txt){const n=verificados(),t=sinTildes(txt);
  if(n>=VERIFICAR.length)return "Verificación completa. Bien hecho, equipo. Cambio.";
  const prev=sinTildes(st.chat.filter(m=>m.r==="u").slice(0,-1).map(m=>m.t).join(" "));
  const antes=(()=>{let k=0;for(const v of VERIFICAR){if(prev.includes(v.ok))k++;else break}return k})();
  if(n>antes)return "Correcto. "+VERIFICAR[n].q+" Cambio.";
  if(t.includes("llave"))return "Sin verificación no hay llave. "+VERIFICAR[n].q+" Cambio.";
  return "La señal no coincide. Repito: "+VERIFICAR[n].q+" Cambio."}
async function consultarGroq(){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),12000);
  try{const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",signal:ctl.signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+groqKey},
      body:JSON.stringify({model:MODELO,temperature:0.6,max_tokens:120,
        messages:[{role:"system",content:SISTEMA},...st.chat.map(m=>({role:m.r==="u"?"user":"assistant",content:m.t}))]})});
    if(!r.ok)throw new Error(r.status);const j=await r.json();return (j.choices[0].message.content||"").trim()||null}
  finally{clearTimeout(to)}}
let esperandoRadio=false;
async function enviarRadio(txt){
  if(esperandoRadio||!txt.trim())return;esperandoRadio=true;
  st.chat.push({r:"u",t:txt.trim().slice(0,300)});save();pintarChat(true);
  let resp=null;
  if(groqKey){try{resp=await consultarGroq()}catch(e){resp=null}}
  if(!resp)resp=simulado(txt);
  st.chat.push({r:"o",t:resp});
  // la llave la manda la página, no la IA: solo cuando el equipo respondió bien las tres
  if(!st.llaveDada&&verificados()>=VERIFICAR.length){st.llaveDada=true;st.chat.push({r:"o",t:"Verificación confirmada. La llave del candado de Elba es "+LLAVE+". Cambio y fuera."})}
  save();esperandoRadio=false;pintarChat(false);
}
function pintarChat(pensando){const c=document.getElementById("chat");if(!c)return;
  c.innerHTML=st.chat.map(m=>`<div class="m ${m.r==="u"?"yo":"op"}">${m.r==="u"?"":"<b>Río Grande</b>"}${esc(m.t)}</div>`).join("")+(pensando?`<div class="m op"><b>Río Grande</b>…</div>`:"");
  c.scrollTop=c.scrollHeight;const b=document.getElementById("env");if(b)b.disabled=!!pensando}

function leerHash(){const h=location.hash.slice(1);if(h&&h!=="profe"){llegar(h);history.replaceState(null,"",location.pathname+location.search)}}

// ---------- Panel docente (#profe) ----------

  const hh=two(d.getHours())+":"+two(d.getMinutes());
  app.innerHTML=`<div><div class="eyebrow">Panel docente</div><h1>Largada de la <span>misión</span></h1></div>
  <div class="box"><div class="row"><div><label for="hora">Hora de largada</label><input id="hora" type="time" value="${hh}"></div>
  <div><label for="min">Minutos</label><input id="min" type="number" min="1" max="180" value="${cfg?cfg.m:30}"></div></div>
  <label for="gk">API key de Groq para la radio (no se sube a GitHub: viaja en el QR de largada)</label>
  <input id="gk" type="password" autocomplete="off" placeholder="gsk_…" value="${esc(groqKey)}">
  <button id="gen">Generar QR de largada</button></div>
  <div class="box" id="salida" hidden><div id="qr"></div><p class="small" style="text-align:center">Cada equipo escanea este QR antes de la largada.</p>

  <button class="alt" id="probar">Probar como equipo en este celu</button></div>
  <div class="box"><div class="eyebrow">Respuestas</div>${P.map((p,i)=>`<div class="small">${i+1}. ${p.c} · ${esc(p.ops[p.a])}</div>`).join("")}<div class="small">Palabra: ${PALABRA}</div>
  <div class="small">Radio: ${VERIFICAR.map(v=>v.ok).join(" · ")} · Llave: ${LLAVE}</div></div>
  <button class="alt" id="cart">Carteles de las postas para imprimir</button><div id="carteles"></div>`;
  const gen=(nueva)=>{const [H,M]=document.getElementById("hora").value.split(":").map(Number);const m=+document.getElementById("min").value||30;
    const t=new Date();t.setHours(H,M,0,0);if(t.getTime()<Date.now()-3600000)t.setDate(t.getDate()+1);

    const id=nueva?Math.random().toString(36).slice(2,7):(cfg&&cfg.id)||"";
    ponerLargada({t:t.getTime(),m,id});
    groqKey=document.getElementById("gk").value.trim();try{localStorage.setItem(KG,groqKey)}catch(e){}
    const url=location.origin+location.pathname+"?t="+cfg.t+"&m="+m+(id?"&id="+id:"")+(groqKey?"&k="+encodeURIComponent(groqKey):"");
    const q=document.getElementById("qr");q.innerHTML="";
    if(window.QRCode)new QRCode(q,{text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});else q.textContent=url;
    const fin=new Date(cfg.t+m*60000);
    document.getElementById("lfin").textContent="Arranca a las "+two(t.getHours())+":"+two(t.getMinutes())+" · termina a las "+two(fin.getHours())+":"+two(fin.getMinutes());
    document.getElementById("clarg").textContent=two(t.getHours())+two(t.getMinutes())+"-"+m;

  document.getElementById("gen").onclick=()=>gen(true);
  document.getElementById("probar").onclick=()=>{history.replaceState(null,"",location.pathname);render()};
  document.getElementById("cart").onclick=()=>{const c=document.getElementById("carteles");c.innerHTML="";
    P.forEach(p=>{const d=document.createElement("div");d.className="cartel";d.innerHTML=`<h2>SEÑAL DETECTADA</h2><div class="q"></div><p>Escaneá con la cámara o escribí este código:</p><b>${p.c}</b>`;c.appendChild(d);
      if(window.QRCode)new QRCode(d.querySelector(".q"),{text:location.origin+location.pathname+"#"+p.c,width:380,height:380,correctLevel:QRCode.CorrectLevel.H})});
    setTimeout(()=>{try{window.print()}catch(e){}},400)};
  if(cfg&&fase()!=="fin"){const t=new Date(cfg.t);document.getElementById("hora").value=two(t.getHours())+":"+two(t.getMinutes());gen(false)}
}

// ---------- Juego ----------
function render(){
  if(location.hash==="#profe"){panel();return}

    <div class="reloj" id="reloj">${textoReloj()}</div>
    <div class="energia">Traje <div class="barra ${st.energia<=30?"baja":""}"><i style="width:${st.energia}%"></i></div>${st.energia}%</div></div>`;

  const llegada=aviso.startsWith("new"); aviso="";

  if(st.fin){
    h+=`<div class="box found"><div class="eyebrow">Misión cumplida · ${mmss(st.fin-cfg.t)}</div>${medio(N-1)}<p class="relato">${FINAL}</p>
    <p>Encendieron las ${N} balizas. Estas son sus letras, mezcladas:</p><div class="letras">${mezcla().map(l=>`<div class="letra">${l}</div>`).join("")}</div>
    <p class="small">Ordénenlas para formar la palabra secreta y vengan a decírmela.</p></div>`;
  } else if(f==="sin"){
    h+=`<div class="box"><p>Escaneen el QR de largada que les muestro o escriban el código que está debajo.</p></div>`+cajaLargada();

    h+=`<div class="box">${foto("elba")}<p class="relato">${INTRO}</p><p>La largada es a las <b>${horaLargada()}</b>. Ahí aparece la primera pista.</p></div>`+cajaLargada();
  } else if(f==="fin"){
    h+=`<div class="box found"><div class="eyebrow">Tiempo cumplido</div><p class="relato">La nevada cubrió la escuela.</p>

  document.getElementById("rs").onclick=function(){if(this.dataset.c){st=nuevo();save();render()}else{this.dataset.c=1;this.textContent="Tocá de nuevo para confirmar"}};
}
// Letras mezcladas siempre igual para cada equipo (no cambian al recargar)
function mezcla(){const a=letras();let s=0;for(const ch of st.equipo)s=(s*31+ch.charCodeAt(0))>>>0;
  for(let i=a.length-1;i>0;i--){s=(s*1103515245+12345)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

leerHash();render();

// Nieve en las ventanas de las imágenes
(function(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const est=new WeakMap();
  (function loop(){document.querySelectorAll("canvas.ventana").forEach(c=>{
    const W=c.clientWidth,H=c.clientHeight;if(!W)return;
    if(c.width!==W||c.height!==H){c.width=W;c.height=H}
    let F=est.get(c);if(!F){F=Array.from({length:45},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.5,v:Math.random()*.5+.25,o:Math.random()*.5+.5}));est.set(c,F)}
    const x=c.getContext("2d");x.clearRect(0,0,W,H);
    F.forEach(f=>{f.y+=f.v;f.x+=Math.sin(f.y/18)*.25;if(f.y>H){f.y=-3;f.x=Math.random()*W}
      x.fillStyle="rgba(190,235,255,"+f.o+")";x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill()});
    const v=VENTANA[c.dataset.k];if(v&&v.hueco){const g=v.hueco;x.save();x.globalCompositeOperation="destination-out";x.beginPath();
      x.ellipse((g.x-v.l)/v.w*W,(g.y-v.t)/v.h*H,g.rx/v.w*W,g.ry/v.h*H,0,0,7);x.fill();x.restore()}});
    requestAnimationFrame(loop)})()})();
// Nevada de fondo
(function(){const c=document.getElementById("nieve");if(!c.getContext||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const x=c.getContext("2d");let W,H,F=[];const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener("resize",rs);
  for(let i=0;i<60;i++)F.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.6,v:Math.random()*.5+.2});
  const col=getComputedStyle(document.documentElement).getPropertyValue("--snow").trim()||"#cfe3ff";
  (function loop(){x.clearRect(0,0,W,H);x.fillStyle=col;F.forEach(f=>{f.y+=f.v;f.x+=Math.sin(f.y/40)*.3;if(f.y>H){f.y=-5;f.x=Math.random()*W}x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill()});requestAnimationFrame(loop)})()})();
</script>
