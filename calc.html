<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calculadora</title>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
        }
        html, body { 
            overflow: hidden; 
            position: fixed; 
            width: 100%; 
            height: 100%; 
            touch-action: none; 
            background-color: #000; 
            margin: 0; 
            font-family: -apple-system, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .calculator { background: #1c1c1c; padding: 20px; border-radius: 20px; width: 280px; box-shadow: 0px 0px 20px rgba(0,0,0,0.8); }
        #display { width: 100%; height: 70px; font-size: 40px; text-align: right; margin-bottom: 15px; padding: 5px; box-sizing: border-box; background: transparent; color: white; border: none; outline: none; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { height: 60px; font-size: 24px; cursor: pointer; background: #333; color: white; border: none; border-radius: 50%; }
        button:active { background: #555; }
        .operator { background: #ff9f0a; }
        .operator:active { background: #cc7f08; }
        .top-btn { background: #a5a5a5; color: black; }
        .top-btn:active { background: #888; }
        .zero { grid-column: span 2; border-radius: 30px; text-align: left; padding-left: 25px; }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
        <button class="top-btn" onclick="clearDisplay()">AC</button>
        <button class="top-btn" onclick="append('+/-')">+/-</button>
        <button class="top-btn" onclick="append('%')">%</button>
        <button class="operator" onclick="append('/')">÷</button>
        
        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="append('*')">×</button>
        
        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="operator" onclick="append('-')">−</button>
        
        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button class="operator" onclick="append('+')">+</button>
        
        <button class="zero" onclick="append('0')">0</button>
        <button onclick="append('.')">,</button>
        <button class="operator" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let display = document.getElementById('display');
    let equalsCount = 0;
    let isForcing = false;
    let forceString = "";
    let forceIndex = 0;
    let forceTarget = 21440; 

    function append(value) {
        let visualValue = value;
        if (value === '*') visualValue = '×';
        if (value === '-') visualValue = '-';
        if (value === '/') visualValue = '÷';
        
        if (isForcing && forceIndex < forceString.length) {
            // El espectador aprieta botones sin mirar.
            // Imprimimos el dígito que necesitamos sin importar qué tocó.
            display.value += forceString[forceIndex];
            forceIndex++;
        } else if (!isForcing) {
            display.value += visualValue;
            
            // Si aprieta '+' y ya apretó el igual dos veces antes, activamos la trampa
            if (value === '+' && equalsCount === 2) {
                isForcing = true;
                let currentTotal = parseFloat(display.value);
                let difference = forceTarget - currentTotal;
                forceString = difference.toString();
                forceIndex = 0;
            }
        }
    }

    function clearDisplay() {
        // Si aprietan borrar durante el forzaje, lo tomamos como un toque ciego más
        if (isForcing && forceIndex < forceString.length) {
            append('0'); 
            return;
        }
        display.value = '';
        equalsCount = 0;
        isForcing = false;
    }

    function calculate() {
        // Si aprietan igual durante el forzaje pero faltan números, lo tomamos como un toque ciego más
        if (isForcing && forceIndex < forceString.length) {
            append('0'); 
            return;
        }
        try {
            let mathString = display.value.replace(/×/g, '*').replace(/÷/g, '/');
            display.value = eval(mathString);
            
            if (!isForcing) {
                equalsCount++;
            } else {
                // Al finalizar el truco, se reinicia el contador por si querés repetir
                equalsCount = 0;
                isForcing = false;
            }
        } catch (e) {
            display.value = 'Error';
        }
    }
</script>

</body>
</html>
