<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #000; margin: 0; font-family: -apple-system, sans-serif; }
        .calculator { background: #1c1c1c; padding: 20px; border-radius: 20px; width: 280px; box-shadow: 0px 0px 20px rgba(0,0,0,0.8); }
        #display { width: 100%; height: 70px; font-size: 40px; text-align: right; margin-bottom: 15px; padding: 5px; box-sizing: border-box; background: transparent; color: white; border: none; outline: none; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { height: 60px; font-size: 24px; cursor: pointer; background: #333; color: white; border: none; border-radius: 50%; }
        button:active { background: #555; }
        .operator { background: #ff9f0a; }
        .operator:active { background: #cc7f08; }
        .top-btn { background: #a5a5a5; color: black; }
        .top-btn:active { background: #888; }
        .zero { grid-column: span 2; border-radius: 30px; text-align: left; padding-left: 25px; }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
        <button class="top-btn" onclick="clearDisplay()">AC</button>
        <button class="top-btn" onclick="append('+/-')">+/-</button>
        <button class="top-btn" onclick="append('%')">%</button>
        <button class="operator" onclick="append('/')">÷</button>
        
        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="append('*')">×</button>
        
        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="operator" onclick="append('-')">−</button>
        
        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button class="operator" onclick="append('+')">+</button>
        
        <button class="zero" onclick="append('0')">0</button>
        <button onclick="append('.')">,</button>
        <button class="operator" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let display = document.getElementById('display');
    let operatorCount = 0;
    let isForcing = false;
    let forceString = "";
    let forceIndex = 0;
    let forceTarget = 21440; 

    function append(value) {
        let visualValue = value;
        if (value === '*') visualValue = '×';
        if (value === '-') visualValue = '-';
        if (value === '/') visualValue = '÷';
        
        if (['+', '-', '*', '/'].includes(value)) {
            operatorCount++;
            display.value += visualValue;
            
            // Al tocar el tercer operador (el + después de los 4 dígitos), se activa la trampa
            if (operatorCount === 3) {
                isForcing = true;
                let currentMath = display.value.slice(0, -1).replace(/×/g, '*').replace(/÷/g, '/');
                let currentTotal = eval(currentMath);
                
                // Calcula el número exacto que falta para llegar a 21440
                let difference = forceTarget - currentTotal;
                forceString = difference.toString();
                forceIndex = 0;
            }
        } else if (isForcing && value !== '=') {
            // El espectador aprieta botones sin mirar
            if (forceIndex < forceString.length) {
                display.value += forceString[forceIndex];
                forceIndex++;
            }
            // Si sigue apretando más botones de la cuenta, los ignoramos
        } else {
            display.value += value;
        }
    }

    function clearDisplay() {
        display.value = '';
        operatorCount = 0;
        isForcing = false;
    }

    function calculate() {
        try {
            let mathString = display.value.replace(/×/g, '*').replace(/÷/g, '/');
            display.value = eval(mathString);
            operatorCount = 0;
            isForcing = false;
        } catch (e) {
            display.value = 'Error';
        }
    }
</script>

</body>
</html>
